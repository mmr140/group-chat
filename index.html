<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group Chat</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f4f7;
    height: 100vh;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 850px;
    height: 100vh;
    background: white;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 20px rgba(0,0,0,.08);
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: #315efb;
    color: white;
    display: grid;
    place-items: center;
    font-weight: bold;
  }
  header h1 { margin: 0; font-size: 18px; }
  header small { color: #777; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }
  .message {
    margin: 10px 0;
    max-width: 75%;
  }
  .message.mine { margin-left: auto; }
  .name {
    font-size: 12px;
    color: #777;
    margin: 0 0 4px 8px;
  }
  .bubble {
    display: inline-block;
    padding: 10px 14px;
    border-radius: 18px;
    background: #e9edf3;
    line-height: 1.35;
  }
  .mine .bubble {
    background: #315efb;
    color: white;
  }
  .time {
    font-size: 10px;
    color: #999;
    margin: 3px 8px;
  }
  .composer {
    border-top: 1px solid #ddd;
    padding: 12px;
    display: flex;
    gap: 8px;
  }
  input {
    flex: 1;
    border: 1px solid #ccc;
    border-radius: 22px;
    padding: 12px 16px;
    font-size: 15px;
    outline: none;
  }
  button {
    border: 0;
    border-radius: 22px;
    padding: 0 20px;
    background: #315efb;
    color: white;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { opacity: .9; }
  .notice {
    text-align: center;
    color: #888;
    font-size: 12px;
    padding: 8px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">G</div>
    <div>
      <h1>Our Group</h1>
      <small>16 members • SMS bridge ready</small>
    </div>
  </header>

  <div id="messages">
    <div class="notice">This is the free prototype. Messages are currently stored only in this browser.</div>
    <div class="message">
      <div class="name">Mike</div>
      <div class="bubble">Hey everyone! 👋</div>
      <div class="time">2:01 PM</div>
    </div>
    <div class="message">
      <div class="name">Sarah</div>
      <div class="bubble">Hi!</div>
      <div class="time">2:02 PM</div>
    </div>
  </div>

  <form class="composer" id="form">
    <input id="input" autocomplete="off" placeholder="Type a message..." />
    <button type="submit">Send</button>
  </form>
</div>

<script>
const form = document.getElementById("form");
const input = document.getElementById("input");
const messages = document.getElementById("messages");

function addMessage(text) {
  const wrapper = document.createElement("div");
  wrapper.className = "message mine";

  const now = new Date();
  const time = now.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});

  wrapper.innerHTML = `
    <div class="name">You</div>
    <div class="bubble"></div>
    <div class="time">${time}</div>
  `;
  wrapper.querySelector(".bubble").textContent = text;
  messages.appendChild(wrapper);
  messages.scrollTop = messages.scrollHeight;
}

form.addEventListener("submit", e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  addMessage(text);
  input.value = "";
  input.focus();
});
</script>
</body>
</html>
