<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Group Chat</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f4f7;
  height:100vh;
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:850px;
  height:100vh;
  background:#fff;
  display:flex;
  flex-direction:column;
  box-shadow:0 0 20px rgba(0,0,0,.08);
}

header{
  padding:16px 20px;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  background:#315efb;
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:bold;
}

header h1{
  margin:0;
  font-size:18px;
}

header small{
  color:#777;
}

#status{
  font-size:11px;
  color:#777;
  margin-left:auto;
}

#messages{
  flex:1;
  overflow-y:auto;
  padding:20px;
}

.message{
  margin:10px 0;
  max-width:75%;
}

.message.mine{
  margin-left:auto;
}

.name{
  font-size:12px;
  color:#777;
  margin:0 0 4px 8px;
}

.bubble{
  display:inline-block;
  padding:10px 14px;
  border-radius:18px;
  background:#e9edf3;
  line-height:1.35;
  overflow-wrap:anywhere;
}

.mine .bubble{
  background:#315efb;
  color:#fff;
}

.time{
  font-size:10px;
  color:#999;
  margin:3px 8px;
}

.composer{
  border-top:1px solid #ddd;
  padding:12px;
  display:flex;
  gap:8px;
}

input{
  flex:1;
  border:1px solid #ccc;
  border-radius:22px;
  padding:12px 16px;
  font-size:15px;
  outline:none;
}

button{
  border:0;
  border-radius:22px;
  padding:0 20px;
  background:#315efb;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
}

.notice{
  text-align:center;
  color:#888;
  font-size:12px;
  padding:8px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="avatar">G</div>

  <div>
    <h1>Our Group</h1>
    <small>Shared group chat</small>
  </div>

  <div id="status">Connecting…</div>
</header>

<div id="messages">
  <div class="notice" id="loading">
    Loading messages…
  </div>
</div>

<form class="composer" id="form">

  <input
    id="input"
    autocomplete="off"
    maxlength="1000"
    placeholder="Type a message..."
    disabled
  >

  <button id="send" type="submit" disabled>
    Send
  </button>

</form>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://hwejjrpahouqyquypvma.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_QzopEEC0M25FDyG4TGF5Hg_bqabvGtm";

const { createClient } = window.supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const messages = document.getElementById("messages");
const status = document.getElementById("status");
const loading = document.getElementById("loading");

let myName = localStorage.getItem("groupChatName");

if(!myName){

  myName =
    prompt("What name should appear on your messages?") ||
    "Guest";

  myName = myName.trim().slice(0,40) || "Guest";

  localStorage.setItem(
    "groupChatName",
    myName
  );
}

function addMessage(row){

  const wrapper = document.createElement("div");

  wrapper.className =
    "message" +
    (row.name === myName ? " mine" : "");

  const time =
    new Date(row.created_at)
    .toLocaleTimeString([],{
      hour:"numeric",
      minute:"2-digit"
    });

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = row.name;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = row.message;

  const timestamp = document.createElement("div");
  timestamp.className = "time";
  timestamp.textContent = time;

  wrapper.appendChild(name);
  wrapper.appendChild(bubble);
  wrapper.appendChild(timestamp);

  messages.appendChild(wrapper);

  messages.scrollTop =
    messages.scrollHeight;
}

async function loadMessages(){

  const { data, error } =
    await db
      .from("messages")
      .select("*")
      .order("created_at",{
        ascending:true
      })
      .limit(200);

  if(error){

    status.textContent =
      "Database error";

    console.error(error);

    return;
  }

  loading.remove();

  data.forEach(addMessage);

  status.textContent =
    "Online";

  input.disabled = false;
  send.disabled = false;

  input.focus();
}

form.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();

    const text =
      input.value.trim();

    if(!text) return;

    send.disabled = true;

    const { error } =
      await db
        .from("messages")
        .insert({
          name:myName,
          message:text
        });

    if(error){

      alert(
        "Message could not be sent."
      );

      console.error(error);

    }else{

      input.value = "";
    }

    send.disabled = false;

    input.focus();
  }
);

db
.channel("group-chat-messages")

.on(
  "postgres_changes",
  {
    event:"INSERT",
    schema:"public",
    table:"messages"
  },
  function(payload){

    addMessage(payload.new);
  }
)

.subscribe(function(state){

  if(state === "SUBSCRIBED"){

    status.textContent =
      "Online";
  }
});

loadMessages();

</script>

</body>
</html>
